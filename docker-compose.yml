services:
  payroll-app:
    build: .
    container_name: payroll-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/work_records
      SESSION_SECRET: "change-me-long-random"
    depends_on:
      - postgres
      
  postgres:
    image: postgres:16
    container_name: workrecords-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_records
    ports:
      - "5432:5432"
    volumes:
      - workrecords_pgdata:/var/lib/postgresql/data

volumes:
  workrecords_pgdata:
