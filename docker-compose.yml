services:
  payroll-app:
    build: .
    container_name: payroll-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # IMPORTANT: store sqlite in mounted folder, not inside container
      DB_PATH: /app/data/data.sqlite
      SESSION_SECRET: "change-me-long-random"
    volumes:
      - ./data:/app/data
